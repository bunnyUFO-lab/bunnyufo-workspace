# The site's data service, beside the Caddy that serves the workspaces.
#
# Deployed by site/deploy/publish-site-api.sh, which copies site/api to
# ${BUW_DOCS_ROOT:-/srv/buw-docs}/_app/api and runs `docker compose up -d` here.
#
# The bucket and its key live one folder up, in $BUW_DOCS_ROOT/_app/api.env — outside everything
# that script rsyncs, so no deploy can overwrite or delete it. Never in this repo:
#   BUW_S3_BUCKET=…            the cards bucket
#   BUW_S3_REGION=us-east-1
#   AWS_ACCESS_KEY_ID=…        a key limited to that bucket (tools/workspace/setup-bucket.sh)
#   AWS_SECRET_ACCESS_KEY=…
#   REQUIRE_REMOTE_USER=1      writes need the Remote-User header NPM sets after the passkey check
#   HERMES_URL=…, HERMES_API_KEY=…, STT_URL=…, STT_API_KEY=…   chat and push-to-talk (optional)
#   HUB=1                      turns on the Hub routes (/api/hub/…, hub.mjs); anything else leaves them off
#
# The service reads that file itself, through the BUW_DOCS_ROOT mount, rather than compose
# reading it as an env_file: the file is root-only and compose runs as whoever deploys, so
# env_file turned "the key is readable by root alone" into a failed deploy.
# Without the file the service still runs, answers /api/capabilities with write:false and a
# reason, and serves no cards — there is nowhere to read them from.
services:
  site-api:
    image: node:22-bookworm-slim
    container_name: buw-site-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "main.mjs"]
    environment:
      BUW_ENV_FILE: ${BUW_DOCS_ROOT:-/srv/buw-docs}/_app/api.env
      PORT: "8099"
    volumes:
      - ./:/app:ro
      # Only for api.env: cards are no longer on this disk.
      - ${BUW_DOCS_ROOT:-/srv/buw-docs}:${BUW_DOCS_ROOT:-/srv/buw-docs}:ro
    # The network the buw-docs stack already made, so Caddy can reach this by name.
    networks: [buw-docs_default]
    # Not published to the host: Caddy reaches it on the shared network, nothing else can.
    expose: ["8099"]

networks:
  buw-docs_default:
    external: true
